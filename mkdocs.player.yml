site_name: Cybermancy — Player Guide
site_url: https://knightweaver.github.io/cybermancy/player/
docs_dir: docs/player-facing
site_dir: _site/player
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
extra_css:
  - styles/items.css
  - https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css
  # Bump the cache token whenever atlas front-end assets change.
  - styles/cybermancy-atlas.css?v=2
extra_javascript:
  - js/table-filter.js
  - https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js
  - js/cybermancy-atlas.js?v=2
plugins:
  - search
  - include-markdown
  - macros:
      module_name: docs/include/load-csv
nav:
  - Home: index.md
  - Cybermancy rules: rules/index.md
  - World:
      - Timeline (player): index.md
      - Megacorps: world/corps.md
      - Seattle Atlas: world/seattle-atlas.md
      - Communities: world/communities.md
      - PCs: adventures/pcs.md
      - Locations: adventures/locations.md
      - Known NPCs: adventures/npcs.md
  - Items:
      - Ammo: items/ammo.md
      - Armors: items/armors.md
      - Consumables: items/consumables.md
      - Cybernetics: items/cybernetics.md
      - Drones & Devices: items/drones-devices.md
      - Loot: items/loot.md
      - Mods: items/mods.md
      - Weapons: items/weapons.md
      - All Tier 1 Items: items/tier-1-items.md
  - System:
      - Classes: system/classes.md
      - Domains: system/domains.md
      - Features: system/features.md
      - Subclasses: system/subclasses.md
