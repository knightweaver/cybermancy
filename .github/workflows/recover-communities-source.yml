name: Recover Cybermancy Communities Source

on:
  push:
    branches:
      - release/v0.1.13-prep
    paths:
      - ".github/workflows/recover-communities-source.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-prep branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.13-prep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Foundry pack tooling
        run: npm ci --no-audit --no-fund
      - name: Download last published Cybermancy runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cybermancy-recovery
          gh release download v0.1.12             --pattern "cybermancy-v0.1.12.zip"             --dir /tmp/cybermancy-recovery
          unzip -q /tmp/cybermancy-recovery/cybermancy-v0.1.12.zip             -d /tmp/cybermancy-recovery/runtime
      - name: Locate and extract Communities Compendium
        shell: bash
        run: |
          PACK_DIR="$(find /tmp/cybermancy-recovery/runtime -type d \( -path '*/packs/system/communities' -o -path '*/packs/system/communities.db' \) | head -n 1)"
          if [ -z "$PACK_DIR" ]; then
            echo "Could not locate packs/system/communities in v0.1.12 runtime."
            exit 1
          fi
          rm -rf src/packs/system/communities
          mkdir -p src/packs/system/communities
          PACK_DIR="$PACK_DIR" node --input-type=module <<'NODE'
          import { extractPack } from "@foundryvtt/foundryvtt-cli";
          import process from "node:process";

          function transformName(doc) {
            const safeName = (doc.name ?? "unnamed").replace(/[^a-zA-Z0-9А-я]/g, "_");
            const keyType = doc._key?.split("!")[1];
            const prefix = ["actors", "items"].includes(keyType)
              ? doc.type
              : keyType ?? "document";
            return `${prefix}_${safeName}_${doc._id}.json`;
          }

          await extractPack(
            process.env.PACK_DIR,
            "src/packs/system/communities",
            { yaml: false, transformName }
          );
          NODE
          COUNT="$(find src/packs/system/communities -maxdepth 1 -type f -name '*.json' | wc -l)"
          if [ "$COUNT" -lt 1 ]; then
            echo "Communities extraction produced no JSON source documents."
            exit 1
          fi
          echo "Recovered $COUNT Communities source entries."
      - name: Commit recovered canonical source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/packs/system/communities
          if git diff --cached --quiet; then
            echo "No Communities source recovery changes were required."
            exit 0
          fi
          git commit -m "Recover canonical Communities source from v0.1.12 runtime"
          git push origin HEAD:release/v0.1.13-prep
