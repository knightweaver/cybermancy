name: Rulebook Maintenance Validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build/rulebook/**'
      - 'docs/**'
      - 'src/**'
      - 'assets/**'
      - 'mkdocs*.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'build/rulebook/**'
      - 'docs/**'
      - 'src/**'
      - 'assets/**'
      - 'mkdocs*.yml'

permissions:
  contents: read

jobs:
  maintenance-validation:
    name: Rulebook maintenance validation
    runs-on: ubuntu-latest

    steps:
      - name: Configure byte-preserving line endings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize frozen byte contracts
        shell: bash
        run: |
          cat > .git/info/attributes <<'EOF'
          * text=auto eol=lf
          build/rulebook/inventory/rulebook-inventory.json text eol=crlf
          build/rulebook/inventory/rulebook-inventory.csv text eol=crlf
          build/rulebook/inventory/rulebook-inventory-report.md text eol=crlf
          EOF
          python - <<'PY'
          from pathlib import Path
          for name in (
              'rulebook-inventory.json',
              'rulebook-inventory.csv',
              'rulebook-inventory-report.md',
          ):
              path = Path('build/rulebook/inventory') / name
              data = path.read_bytes().replace(b'\r\n', b'\n')
              path.write_bytes(data.replace(b'\n', b'\r\n'))
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and import rulebook packages
        shell: bash
        run: |
          python -m py_compile \
            build/rulebook/scripts/build-rulebook.py \
            build/rulebook/scripts/maintain-rulebook.py
          python -m compileall -q \
            build/rulebook/scripts/rulebook_production \
            build/rulebook/scripts/rulebook_layout
          PYTHONPATH=build/rulebook/scripts python - <<'PY'
          import rulebook_layout
          import rulebook_production
          import rulebook_production.baseline
          import rulebook_production.freeze_state
          import rulebook_production.preflight
          print('Rulebook package import smoke check: PASS')
          PY

      - name: Run maintenance baseline check
        run: python build/rulebook/scripts/build-rulebook.py baseline-check --verbose

      - name: Run maintenance status
        run: python build/rulebook/scripts/maintain-rulebook.py status --verbose

      - name: Run maintenance build dry-run
        run: python build/rulebook/scripts/maintain-rulebook.py build --profile complete-rulebook --dry-run

      - name: Run maintenance release dry-run
        run: python build/rulebook/scripts/maintain-rulebook.py release --profile all --dry-run

      - name: Run complete rulebook unit suite
        run: python -m unittest discover -s build/rulebook/scripts/tests -p "test_*.py" -v

      - name: Run optional complete-rulebook render acceptance
        shell: bash
        run: |
          missing=()
          for tool in pandoc lualatex pdfinfo pdftotext pdffonts; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Full publishing toolchain unavailable: ${missing[*]}"
            echo "Complete-rulebook rendering is deferred to the maintainer."
          else
            python build/rulebook/scripts/maintain-rulebook.py build --profile complete-rulebook --verbose
          fi
