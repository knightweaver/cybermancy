name: Cybermancy v0.2.0 data migration

on:
  push:
    branches: [migration/v0.2.0-f14-dh2]
    paths:
      - "module.json"
      - "tools/validate-release-manifest.mjs"
      - "tools/compile-packs.mjs"
      - "tools/extract-packs.mjs"
      - "tools/build-runtime-package.py"
      - "tools/prepare-release.py"
      - "tools/migrate-dh2-compendia.py"
      - "tools/validate-dh2-source.py"
      - "tools/validate-domain-registration.mjs"
      - "tools/validate-compiled-packs.mjs"
      - "build/rulebook/scripts/**"
      - "pyCybermancy/rulebook_normalize/**"
      - ".github/workflows/migration-data-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybermancy-v0.2.0-data-migration
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/v0.2.0-f14-dh2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node build dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate v0.2.0 runtime manifest target
        run: npm run validate:release-manifest
      - name: Project frozen v0.1.14 source to DH2-owned source shape
        run: python tools/migrate-dh2-compendia.py --repo . --baseline maintenance/baseline-v0.2.0.json --write
      - name: Validate preservation and DH2 source shape
        run: python tools/validate-dh2-source.py --repo . --baseline maintenance/baseline-v0.2.0.json
      - name: Validate Domains and artwork
        run: |
          npm run validate:domains
          npm run validate:assets -- --strict-prefix
      - name: Compile and re-extract all declared Compendia
        run: |
          npm run clean:packs
          npm run compile:packs
          npm run validate:compiled-packs
      - name: Build deterministic Foundry 14 runtime package
        run: npm run build:runtime-package
      - name: Verify runtime package metadata
        run: |
          python - <<'PY'
          import json
          report=json.load(open("build/release/runtime-package.json", encoding="utf-8"))
          assert report["status"] == "PASS"
          assert report["moduleVersion"] == "0.2.0"
          assert report["compiledCompendiumCount"] == 15
          assert report["foundry14DbManifestPathsValidated"] is True
          mappings=report["packMappings"]
          assert len(mappings) == 15
          assert all(m["manifestPath"].endswith(".db") for m in mappings)
          assert all(not m["compiledDirectory"].endswith(".db") for m in mappings)
          print(json.dumps(report, indent=2))
          PY
      - name: Rulebook migration regression
        run: |
          python -m unittest discover -s build/rulebook/scripts/tests -p "test_rulebook_normalization.py" -v
          python -m unittest discover -s build/rulebook/scripts/tests -p "test_step4_class_relationships.py" -v
          python -m unittest discover -s build/rulebook/scripts/tests -p "test_step4_domain_semantics.py" -v
          python -m unittest discover -s build/rulebook/scripts/tests -p "test_step4_encounter_semantics.py" -v
          python -m unittest discover -s build/rulebook/scripts/tests -p "test_step4_feature_equivalence.py" -v
          python -m unittest discover -s build/rulebook/scripts/tests -p "test_step4b_weapon_semantics.py" -v
          # Read-only characterization. A stale selected inventory/freeze binding is
          # expected until normal rulebook maintenance is run after this migration;
          # report it, but do not refresh or redesign the rulebook in this workflow.
          python build/rulebook/scripts/build-rulebook.py baseline-check --verbose || true
      - name: Commit deterministic source projection and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/packs maintenance/migration/v0.2.0-source-migration-report.json maintenance/migration/v0.2.0-source-validation-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Migrate Cybermancy Compendium source for Daggerheart 2.10.5"
            git push origin HEAD:migration/v0.2.0-f14-dh2
          fi
