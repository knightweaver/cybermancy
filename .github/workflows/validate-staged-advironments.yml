name: Validate staged advironments

on:
  push:
    branches:
      - feat/cascadian-hunter-ballard-commons
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate release and strict asset paths
        run: npm run validate:release
      - name: Compile declared Compendia
        run: |
          npm run clean:packs
          npm run compile:packs
      - name: Validate compiled Compendia
        run: npm run validate:compiled-packs
      - name: Assert staged-advironment counts
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("build/release/compiled-packs.json", "utf8"));
          if (report.status !== "PASS") throw new Error(`compiled-packs status: ${report.status}`);
          if (report.frozenBaselineEntries !== 774) throw new Error(`baseline entries: ${report.frozenBaselineEntries}`);
          if (report.declaredAdditions !== 2) throw new Error(`declared additions: ${report.declaredAdditions}`);
          if (report.expectedTotalEntries !== 776) throw new Error(`expected total: ${report.expectedTotalEntries}`);
          if (report.totalSourceEntries !== 776) throw new Error(`source total: ${report.totalSourceEntries}`);
          if (report.totalExtractedEntries !== 776) throw new Error(`extracted total: ${report.totalExtractedEntries}`);
          const byName = new Map(report.packResults.map(p => [p.packName, p]));
          const adv = byName.get("cybermancy-adversaries");
          const env = byName.get("cybermancy-environments");
          if (!adv || adv.expectedEntryCount !== 134 || adv.sourceEntryCount !== 134 || adv.extractedEntryCount !== 134) {
            throw new Error("adversary count assertion failed");
          }
          if (!env || env.expectedEntryCount !== 11 || env.sourceEntryCount !== 11 || env.extractedEntryCount !== 11) {
            throw new Error("environment count assertion failed");
          }
          console.log(JSON.stringify({
            status: report.status,
            frozenBaselineEntries: report.frozenBaselineEntries,
            declaredAdditions: report.declaredAdditions,
            expectedTotalEntries: report.expectedTotalEntries,
            totalSourceEntries: report.totalSourceEntries,
            totalExtractedEntries: report.totalExtractedEntries,
            adversaries: adv,
            environments: env
          }, null, 2));
          NODE
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: staged-advironments-validation
          path: build/release/compiled-packs.json
          if-no-files-found: error
          retention-days: 7
