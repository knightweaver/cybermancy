name: Transaction 2 PDF Flow Audit

on:
  push:
    branches:
      - txn2-pdf-latex-flow-audit

permissions:
  contents: read

jobs:
  step4-windows:
    name: Materialize frozen Step 4 on Windows
    runs-on: windows-latest

    steps:
      - name: Configure canonical Windows line endings
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Step 4 image dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify clean tree and read-only baseline
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'Working tree is not clean before baseline.' }
          python build/rulebook/scripts/build-rulebook.py baseline-check --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Baseline failed.' }
          if (git status --porcelain) { throw 'Baseline changed tracked repository content.' }

      - name: Materialize frozen Step 4 source
        shell: pwsh
        run: |
          python build/rulebook/scripts/build-rulebook-source.py build
          if ($LASTEXITCODE -ne 0) { throw 'Step 4 materialization failed.' }
          if (git status --porcelain) { throw 'Step 4 changed tracked repository content.' }

      - name: Upload generated Step 4 source
        uses: actions/upload-artifact@v4
        with:
          name: txn2-step4-source
          path: build/rulebook/source
          if-no-files-found: error
          retention-days: 1

  pdf-flow-audit:
    name: Read-only PDF and LaTeX flow audit
    needs: step4-windows
    runs-on: ubuntu-latest

    steps:
      - name: Configure maintenance line endings
        run: git config --global core.autocrlf true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python render inspection dependencies
        run: python -m pip install --disable-pip-version-check Pillow PyMuPDF

      - name: Verify clean tree and read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python build/rulebook/scripts/build-rulebook.py baseline-check --verbose
          test -z "$(git status --porcelain)"

      - name: Download Windows-materialized Step 4 source
        uses: actions/download-artifact@v4
        with:
          name: txn2-step4-source
          path: build/rulebook/source

      - name: Install publication and PDF inspection toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            poppler-utils \
            qpdf \
            mupdf-tools \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-noto-core \
            fonts-roboto \
            fonts-lato
          fc-cache -f

      - name: Build complete production profile once
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python build/rulebook/scripts/build-rulebook.py build --profile complete-rulebook
          test -z "$(git status --porcelain)"

      - name: Collect reproducible flow evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/txn2-evidence"
          mkdir -p "$EVIDENCE"
          PDF="build/rulebook/output/Cybermancy_Core_Rulebook.pdf"
          test -f "$PDF"

          pdfinfo "$PDF" > "$EVIDENCE/pdfinfo.txt"
          pdffonts "$PDF" > "$EVIDENCE/pdffonts.txt"
          pdftotext -layout "$PDF" "$EVIDENCE/complete-rulebook.txt"
          pdftotext -bbox-layout "$PDF" "$EVIDENCE/bbox.html"
          qpdf --check "$PDF" > "$EVIDENCE/qpdf-check.txt" 2>&1
          qpdf --show-pages "$PDF" > "$EVIDENCE/qpdf-pages.txt"
          qpdf --json "$PDF" > "$EVIDENCE/qpdf.json"
          qpdf --qdf --object-streams=disable --stream-data=uncompress "$PDF" "$EVIDENCE/qdf.pdf"
          grep -a -n '/Subtype /Form' "$EVIDENCE/qdf.pdf" > "$EVIDENCE/form-xobjects.txt" || true
          grep -a -n '/Annots' "$EVIDENCE/qdf.pdf" > "$EVIDENCE/annotations.txt" || true
          grep -a -n '/StructTreeRoot' "$EVIDENCE/qdf.pdf" > "$EVIDENCE/struct-tree.txt" || true
          mutool show "$PDF" pages > "$EVIDENCE/mutool-pages.txt"

          python - <<'PY'
          from pathlib import Path
          import html
          import json
          import os
          import re
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          import fitz

          evidence = Path(os.environ['RUNNER_TEMP']) / 'txn2-evidence'
          pdf = Path('build/rulebook/output/Cybermancy_Core_Rulebook.pdf')
          bbox = evidence / 'bbox.html'

          samples = {
              'early-prose': {
                  'anchor': 'Prometheus Cloud',
                  'tex_anchor': 'Prometheus',
                  'source': 'docs/_shared/world/the-resonance.md',
                  'source_text': 'When the first fully self-modifying AI network went online—a distributed system called Prometheus Cloud—its emergence coincided with a planetary energy surge measured across the electromagnetic spectrum.'
              },
              'class-package': {
                  'anchor': 'The world calls them Razz Hackers',
                  'tex_anchor': 'Razz Hackers',
                  'source': 'src/packs/system/classes/Razz_Hacker_pjN7ciiS9yyGB7rP.json',
                  'source_text': 'The world calls them Razz Hackers. They call themselves Neo Monks—adepts who treat spellwork and software as the same living language running beneath neon streets and astral skylines.'
              },
              'late-encounter': {
                  'anchor': 'A mutated sewer alligator',
                  'tex_anchor': 'mutated sewer alligator',
                  'source': 'src/packs/adventures/adversaries/Sewerjaw_Gator_2oJw2pIPP38N7k0s.json',
                  'source_text': "A mutated sewer alligator that ambushes prey in Seattle's underground drainage network."
              },
          }

          tree = ET.parse(bbox)
          pages = [node for node in tree.iter() if node.tag.endswith('page')]
          page_text = []
          for page in pages:
              words = [''.join(w.itertext()) for w in page.iter() if w.tag.endswith('word')]
              page_text.append(' '.join(words))

          for sample in samples.values():
              needle = re.sub(r'\s+', ' ', sample['anchor']).casefold()
              hits = []
              for i, text in enumerate(page_text, 1):
                  normalized = re.sub(r'\s+', ' ', html.unescape(text)).casefold()
                  if needle in normalized:
                      hits.append(i)
              sample['pdf_pages'] = hits

          tex_files = sorted(Path('build/rulebook').rglob('*.tex'))
          selected_tex = None
          for path in tex_files:
              try:
                  text = path.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  continue
              folded = text.casefold()
              if all(s['tex_anchor'].casefold() in folded for s in samples.values()):
                  selected_tex = path
                  break
          if selected_tex:
              shutil.copy2(selected_tex, evidence / 'integrated.tex')
              tex_text = selected_tex.read_text(encoding='utf-8', errors='replace')
              for key, sample in samples.items():
                  pos = tex_text.casefold().find(sample['tex_anchor'].casefold())
                  if pos >= 0:
                      start = max(0, pos - 1100)
                      end = min(len(tex_text), pos + 1700)
                      (evidence / f'{key}-tex.txt').write_text(tex_text[start:end], encoding='utf-8')
                      sample['tex_file'] = str(selected_tex)
                      sample['tex_fragment_found'] = True
                  else:
                      sample['tex_file'] = str(selected_tex)
                      sample['tex_fragment_found'] = False
          else:
              for sample in samples.values():
                  sample['tex_fragment_found'] = False

          doc = fitz.open(pdf)
          pdf_analysis = {}
          for key, sample in samples.items():
              if not sample['pdf_pages']:
                  pdf_analysis[key] = {'status': 'ANCHOR_NOT_FOUND'}
                  continue
              pageno = sample['pdf_pages'][0]
              page = doc[pageno - 1]
              text_dict = page.get_text('dict')
              matched_spans = []
              text_line_count = 0
              anchor_words = [word.casefold() for word in sample['anchor'].split()[:3]]
              for block in text_dict.get('blocks', []):
                  if block.get('type') != 0:
                      continue
                  for line in block.get('lines', []):
                      text_line_count += 1
                      for span in line.get('spans', []):
                          span_text = str(span.get('text', ''))
                          if any(word in span_text.casefold() for word in anchor_words):
                              matched_spans.append({
                                  'text': span_text,
                                  'font': span.get('font'),
                                  'size': span.get('size'),
                                  'bbox': span.get('bbox'),
                              })
              xobjects = []
              for row in page.get_xobjects():
                  xobjects.append({
                      'xref': row[0],
                      'name': row[1],
                      'invoker': row[2],
                      'bbox': list(row[3]) if len(row) > 3 else None,
                  })
              annots = []
              annot_iter = page.annots()
              if annot_iter:
                  for a in annot_iter:
                      annots.append({'type': a.type, 'rect': list(a.rect)})
              content_xrefs = page.get_contents()
              streams = []
              for xref in content_xrefs:
                  raw = doc.xref_stream(xref) or b''
                  streams.append(raw.decode('latin-1', errors='replace'))
              direct = '\n'.join(streams)
              op_counts = {
                  'BT': len(re.findall(r'(?<!\S)BT(?!\S)', direct)),
                  'ET': len(re.findall(r'(?<!\S)ET(?!\S)', direct)),
                  'Do': len(re.findall(r'(?<!\S)Do(?!\S)', direct)),
                  'clip_W': len(re.findall(r'(?<!\S)W\*?(?!\S)', direct)),
                  'q': len(re.findall(r'(?<!\S)q(?!\S)', direct)),
                  'Q': len(re.findall(r'(?<!\S)Q(?!\S)', direct)),
              }
              pdf_analysis[key] = {
                  'status': 'FOUND',
                  'page': pageno,
                  'page_text_lines': text_line_count,
                  'matched_spans': matched_spans,
                  'form_xobjects_on_page': xobjects,
                  'form_xobject_count': len(xobjects),
                  'annotations_on_page': annots,
                  'annotation_count': len(annots),
                  'direct_page_content_xrefs': content_xrefs,
                  'direct_content_operator_counts': op_counts,
              }
              (evidence / f'{key}-direct-content.txt').write_text(direct, encoding='latin-1')

          (evidence / 'samples.json').write_text(json.dumps(samples, indent=2, ensure_ascii=False), encoding='utf-8')
          (evidence / 'pdf-analysis.json').write_text(json.dumps(pdf_analysis, indent=2, ensure_ascii=False), encoding='utf-8')

          for key, sample in samples.items():
              if sample['pdf_pages']:
                  pageno = sample['pdf_pages'][0]
                  for fmt in ('stext', 'trace'):
                      out = evidence / f'{key}-{fmt}.xml'
                      subprocess.run(['mutool', 'draw', '-F', fmt, '-o', str(out), str(pdf), str(pageno)], check=False)
                  with (evidence / f'{key}-pdffonts.txt').open('w', encoding='utf-8') as handle:
                      subprocess.run(['pdffonts', '-f', str(pageno), '-l', str(pageno), str(pdf)], stdout=handle, stderr=subprocess.STDOUT, text=True, check=False)
                  for selector, suffix in [
                      (f'pages/{pageno}', 'page-object'),
                      (f'pages/{pageno}/Resources/XObject', 'xobjects'),
                      (f'pages/{pageno}/Annots', 'annots'),
                      (f'pages/{pageno}/Contents', 'contents-object'),
                  ]:
                      with (evidence / f'{key}-{suffix}.txt').open('w', encoding='utf-8') as handle:
                          subprocess.run(['mutool', 'show', str(pdf), selector], stdout=handle, stderr=subprocess.STDOUT, text=True, check=False)
          PY

          cp "$PDF" "$EVIDENCE/Cybermancy_Core_Rulebook.pdf"
          echo '=== PDF INFO ==='
          cat "$EVIDENCE/pdfinfo.txt"
          echo '=== FONTS ==='
          cat "$EVIDENCE/pdffonts.txt"
          echo '=== SAMPLE LOCATIONS ==='
          cat "$EVIDENCE/samples.json"
          echo '=== PDF OBJECT/RUN ANALYSIS ==='
          cat "$EVIDENCE/pdf-analysis.json"
          echo '=== FORM XOBJECT DECLARATIONS ==='
          cat "$EVIDENCE/form-xobjects.txt" || true
          echo '=== STRUCT TREE ==='
          cat "$EVIDENCE/struct-tree.txt" || true

      - name: Upload Transaction 2 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: txn2-pdf-flow-evidence
          path: ${{ runner.temp }}/txn2-evidence
          if-no-files-found: error
          retention-days: 7
